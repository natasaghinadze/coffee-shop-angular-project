<div class="card">
    <img class="card-img-top" [src]="image()" [alt]="name()">
    <div class="card-body">
        <h5 class="card-title">{{ name() }}</h5>
        <span>${{ price().toFixed(2) }}</span>
    </div>
    <p>{{ description() }}</p>
    <button class="btn-brewly w-100" (click)="addToCart.emit()">Add to Cart</button>
    <a [routerLink]="['/products', id()]">View details</a>
</div>
